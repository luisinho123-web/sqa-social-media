name: CI - SQA Social Media

# Dispara sempre que um PR for aberto ou atualizado com destino à branch main.
on:
  pull_request:
    branches:
      - main

jobs:
  # JOB 1 - Testes de Backend (Atividade 4 - JUnit + H2)
  
  backend-tests:
    name: Testes Backend (JUnit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Garantir permissão de execução do mvnw
        working-directory: ./api
        run: chmod +x mvnw

      - name: Rodar testes do backend
        working-directory: ./api
        run: ./mvnw test -Dmaven.test.failure.ignore=true

  # JOB 2 - Testes de Frontend (Atividade 4 - Jest)
  frontend-tests:
    name: Testes Frontend (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependências
        working-directory: ./client
        run: npm ci

      - name: Rodar testes do frontend
        working-directory: ./client
        run: npm test

  # JOB 3 - Testes E2E e API (Atividade 5 - Playwright)
  e2e-and-api-tests:
    name: Testes E2E e API (Playwright)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: social_media
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configurar application.properties do backend
        working-directory: ./api/src/main/resources
        run: |
          cat > application.properties << EOF
          spring.application.name=demo
          spring.datasource.url=jdbc:mysql://localhost:3306/social_media
          spring.datasource.username=root
          spring.datasource.password=root
          spring.jpa.hibernate.ddl-auto=update
          spring.jpa.show-sql=true
          EOF

      - name: Subir o backend em segundo plano
        working-directory: ./api
        run: |
          chmod +x mvnw
          ./mvnw spring-boot:run &
          npx wait-on http-get://localhost:8080/posts --httpTimeout 5000 --timeout 60000

      - name: Instalar dependências do frontend
        working-directory: ./client
        run: npm ci

      - name: Criar .env do frontend
        working-directory: ./client
        run: echo "NEXT_PUBLIC_BASE_URL=http://localhost:8080" > .env

      - name: Subir o frontend em segundo plano
        working-directory: ./client
        run: |
          npm run build
          npm run start &
          npx wait-on http-get://localhost:3000 --httpTimeout 5000 --timeout 60000

      - name: Instalar dependências do Playwright
        working-directory: ./tests
        run: npm ci

      - name: Instalar navegadores do Playwright
        working-directory: ./tests
        run: npx playwright install --with-deps chromium

      - name: Rodar testes E2E e de API
        working-directory: ./tests
        run: npx playwright test

      - name: Upload do relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7